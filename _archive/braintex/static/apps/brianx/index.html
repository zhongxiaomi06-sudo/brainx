<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian X · 今日推荐</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1120px;margin-inline:auto}.eyebrow{color:#86868b;font-size:13px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.hero h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.04em;margin:6px 0}.links a{color:#06c;text-decoration:none;margin-left:12px}.error{display:none;background:#fff1f0;color:#b42318;border:1px solid #f3b9b4;border-radius:10px;padding:12px;margin:12px 0}.toast{display:none;background:#e8f7ed;color:#18794e;border-radius:10px;padding:12px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:17px;box-shadow:0 8px 24px #1d1d1f0a}.stat small{color:#86868b}.stat strong{font-size:27px;display:block;margin-top:5px}.list{display:grid;gap:14px}.card h2{margin:0;font-size:20px}.meta{color:#86868b;margin:6px 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;background:#f2f2f7}.RECOMMEND_ACCEPT{background:#e8f7ed;color:#18794e}.RECOMMEND_WATCH{background:#e7f0ff;color:#0958d9}.OBSERVE{background:#f2f2f7;color:#86868b}.conf{font-size:12px;color:#86868b}.coverage{margin:8px 0 12px;font-size:12px;color:#86868b}.covbar{height:6px;background:#e9e9ed;border-radius:99px;overflow:hidden;margin-top:4px}.covbar i{display:block;height:100%;background:#30d158}.dimension{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f1f1f3;font-size:13px}.dimension small{color:#86868b;display:block}.bar{height:7px;background:#e9e9ed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#0a84ff}.trial{display:grid;gap:8px;margin-top:12px}.person{border:1px solid #f1f1f3;border-radius:12px;padding:10px 12px}.person b{font-size:14px}.person .score{color:#0a84ff;font-weight:600;margin-left:8px}.person ul{margin:6px 0 0;padding-left:18px;color:#424245;font-size:12px}.actions{margin-top:16px;display:flex;gap:8px}.actions button{border:0;border-radius:9px;padding:8px 14px;background:#0a84ff;color:#fff;cursor:pointer}.actions button.ghost{background:#f2f2f7;color:#1d1d1f}.filter{display:flex;gap:8px;margin-bottom:14px}.filter button{border:1px solid #d1d1d6;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}.filter button.on{background:#1d1d1f;color:#fff}@media(max-width:600px){body{padding:18px}.hero{display:block}.stats{grid-template-columns:1fr}.dimension{grid-template-columns:96px 1fr 120px}}
</style></head><body><div id="error" class="error"></div><div id="toast" class="toast"></div><section class="hero"><div><div class="eyebrow">TTC / BRIAN X · <span id="actor">未登录</span></div><h1>今日推荐</h1></div><nav class="links"><a href="/static/apps/brianx/client.html">客户360</a><a href="/static/apps/brianx/feishu.html">飞书连接</a><a href="/static/apps/brianx/upload.html">上传简历</a><a href="/static/apps/brianx/engagements.html">我的承接</a><a href="/static/apps/brianx/feedback.html">反馈录入</a><a href="/static/apps/brianx/weights.html">调权</a><a href="/static/workspace/index.html">Workspace</a></nav></section><section id="stats" class="stats"></section><div class="filter" id="filter"></div><main id="list" class="list"></main><script>
const errorEl=document.getElementById('error'),toastEl=document.getElementById('toast');
const showError=e=>{errorEl.textContent=e.message||e;errorEl.style.display='block'};
const toast=m=>{toastEl.textContent=m;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',2600)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'暂无数据':`${(Number(v)*100).toFixed(0)}%`;
let actor=localStorage.getItem('brianx_actor')||'';
if(!actor){actor=prompt('输入你的顾问 ID（X-Actor）：')||'';if(actor)localStorage.setItem('brianx_actor',actor)}
document.getElementById('actor').textContent=actor||'未登录';
const H=actor?{'X-Actor':actor}:{};
const ACTION_LABEL={RECOMMEND_ACCEPT:'建议接单',RECOMMEND_WATCH:'建议关注',OBSERVE:'观察','':'未分档'};
const ACTION_ORDER={RECOMMEND_ACCEPT:0,RECOMMEND_WATCH:1,OBSERVE:2};
let ALL=[],FILTER='ALL';
function renderStats(s){document.getElementById('stats').innerHTML=[['推送数',s.pushed??0],['响应率',pct(s.response_rate)],['采纳率',pct(s.adoption_rate)]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}
function renderFilter(){const kinds=['ALL',...new Set(ALL.map(r=>r.action||''))];document.getElementById('filter').innerHTML=kinds.map(k=>`<button class="${FILTER===k?'on':''}" data-k="${k}">${k==='ALL'?'全部':ACTION_LABEL[k]||k}</button>`).join('');document.querySelectorAll('#filter button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.k;renderFilter();render()})}
function render(){const items=ALL.filter(r=>FILTER==='ALL'||r.action===FILTER).sort((a,b)=>(ACTION_ORDER[a.action]??9)-(ACTION_ORDER[b.action]??9)||b.total_score-a.total_score);
document.getElementById('list').innerHTML=items.map(r=>{const dims=r.dimensions||[];const people=r.trial_candidates||[];const cov=Math.round((r.evidence_coverage||0)*100);
return `<article class="card"><h2>${esc(r.job_title)} @ ${esc(r.company)} · ${Number(r.total_score||0).toFixed(1)}分</h2>
<div class="meta"><span class="badge ${esc(r.action)}">${ACTION_LABEL[r.action]||esc(r.action)}</span><span class="conf">置信 ${esc(r.confidence_band||'—')}</span><span class="conf">${esc(r.signal_type)}</span><span class="conf">策略 ${esc(r.policy_version||'—')}</span><span class="conf">状态 ${esc(r.status)}</span></div>
<div class="coverage">证据覆盖 ${cov}%<div class="covbar"><i style="width:${cov}%"></i></div></div>
${dims.map(d=>`<div class="dimension"><span>${esc(d.name)}<small>${esc(d.reason||'')}</small></span><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(d.score)||0))}%"></i></div><span>${Number(d.score||0).toFixed(1)} × ${Number(d.weight||0).toFixed(2)} = ${Number(d.weighted||0).toFixed(1)}</span></div>`).join('')}
<div class="trial">${people.length?people.map(p=>`<div class="person"><b>${esc(p.name)}</b><span class="score">${Number(p.score||0).toFixed(1)}分</span><ul>${(p.evidence||[]).slice(0,2).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`).join(''):'<div class="person">暂无可试单人选</div>'}</div>
${r.fingerprint?`<div class="actions"><button data-cmd="watch" data-fp="${esc(r.fingerprint)}">关注</button><button data-cmd="accept" data-fp="${esc(r.fingerprint)}">接单</button><button class="ghost" data-cmd="dismiss" data-fp="${esc(r.fingerprint)}">暂不考虑</button><button class="ghost" onclick="location.href='/static/apps/brianx/replay.html?rec_id=${r.rec_id}'">回放</button></div>`:''}</article>`}).join('')||'<div class="card">今天暂无推荐。</div>';
document.querySelectorAll('.actions button[data-cmd]').forEach(b=>b.onclick=()=>command(b.dataset.cmd,b.dataset.fp))}
async function command(cmd,fp){if(!actor)return showError('请先设置顾问 ID');let reason='';if(cmd==='dismiss'){reason=prompt('暂不考虑原因（必填）：')||'';if(!reason)return}
const body={fingerprint:fp,idempotency_key:`web:${cmd}:${actor}:${fp}:${new Date().toISOString().slice(0,10)}`,reason_code:reason};
const r=await fetch(`/api/decision/command/${cmd}`,{method:'POST',headers:{'Content-Type':'application/json',...H},body:JSON.stringify(body)});const data=await r.json();
if(!r.ok)return showError(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));toast(`${cmd} 已记录，当前状态 ${data.state}${data.already?'（幂等去重）':''}`)}
Promise.all([fetch('/api/decision/today').then(r=>{if(!r.ok)throw Error('今日推荐加载失败');return r.json()}),fetch('/api/decision/stats?days=7').then(r=>{if(!r.ok)throw Error('统计加载失败');return r.json()})]).then(([today,stats])=>{renderStats(stats);ALL=today.items||[];renderFilter();render()}).catch(showError);
</script></body></html>
