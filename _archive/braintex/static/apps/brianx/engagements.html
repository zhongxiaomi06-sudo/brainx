<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian X · 我的承接</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1000px;margin-inline:auto}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.hero h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;margin:6px 0}.eyebrow{color:#86868b;font-size:13px}.links a{color:#06c;text-decoration:none;margin-left:12px}.cap{background:#fff;border:1px solid #e5e5ea;border-radius:14px;padding:14px 17px;margin-bottom:18px}.capbar{height:8px;background:#e9e9ed;border-radius:99px;overflow:hidden;margin-top:8px}.capbar i{display:block;height:100%;background:#0a84ff}.group{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:17px;margin-bottom:14px}.group h2{font-size:17px;margin:0 0 10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #f1f1f3;padding:10px 0;font-size:14px}.muted{color:#86868b;font-size:12px}.item button{border:0;border-radius:8px;padding:6px 11px;background:#f2f2f7;cursor:pointer;margin-left:6px}.item button.warn{background:#fff0f0;color:#b42318}.error{display:none;background:#fff1f0;color:#b42318;border-radius:10px;padding:12px;margin:12px 0}.badge{border-radius:999px;padding:3px 8px;font-size:12px;background:#f2f2f7}.soon{color:#b42318}
</style></head><body><div id="error" class="error"></div><section class="hero"><div><div class="eyebrow">TTC / BRIAN X · <span id="actor"></span></div><h1>我的承接</h1></div><nav class="links"><a href="/static/apps/brianx/index.html">今日推荐</a><a href="/static/apps/brianx/feedback.html">反馈录入</a></nav></section><section class="cap" id="cap"></section><main id="groups"></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const errorEl=document.getElementById('error');const showError=e=>{errorEl.textContent=e.message||e;errorEl.style.display='block'};
let actor=localStorage.getItem('brianx_actor')||'';if(!actor){actor=prompt('输入你的顾问 ID（X-Actor）：')||'';if(actor)localStorage.setItem('brianx_actor',actor)}
document.getElementById('actor').textContent=actor||'未登录';
const H={'Content-Type':'application/json',...(actor?{'X-Actor':actor}:{})};
const ORDER=['WATCHED','ACCEPTED','RELEASED','COMPLETED','DISMISSED','EXPIRED'];
const LABEL={WATCHED:'关注中',ACCEPTED:'已接单',RELEASED:'已释放',COMPLETED:'已完成',DISMISSED:'暂不考虑',EXPIRED:'已过期'};
const daysTo=(ts)=>{if(!ts)return null;return Math.ceil((new Date(ts)-Date.now())/86400000)};
function render(data){const cap=data.watch_capacity||{used:0,cap:10};document.getElementById('cap').innerHTML=`关注位 <b>${cap.used}/${cap.cap}</b><div class="capbar"><i style="width:${Math.min(100,cap.used/cap.cap*100)}%"></i></div>`;
const groups=data.groups||{};document.getElementById('groups').innerHTML=ORDER.filter(k=>groups[k]?.length).map(k=>`<section class="group"><h2>${LABEL[k]}（${groups[k].length}）</h2>${groups[k].map(it=>{const last=(it.last_action_at||'').slice(0,10);const d90=k==='WATCHED'&&last?90-Math.floor((Date.now()-new Date(last))/86400000):null;const cool=k==='DISMISSED'?daysTo(it.expires_at):null;
return `<div class="item"><div><b>${esc(it.fingerprint)}</b> <span class="badge">v${it.state_version}</span><div class="muted">最近有效动作 ${esc(last)||'—'}${d90!=null?` · <span class="${d90<=14?'soon':''}">${d90>0?d90+' 天后过期':'即将过期'}</span>`:''}${cool!=null&&cool>0?` · 冷却剩余 ${cool} 天`:''}</div></div><div>${k==='WATCHED'?`<button data-cmd="accept" data-fp="${esc(it.fingerprint)}">接单</button>`:''}${k==='ACCEPTED'?`<button data-cmd="complete" data-fp="${esc(it.fingerprint)}">完成</button><button class="warn" data-cmd="release" data-fp="${esc(it.fingerprint)}">释放</button>`:''}</div></div>`}).join('')}</section>`).join('')||'<section class="group">暂无承接记录。</section>';
document.querySelectorAll('button[data-cmd]').forEach(b=>b.onclick=()=>command(b.dataset.cmd,b.dataset.fp))}
async function command(cmd,fp){let reason='',summary='';if(cmd==='release'){reason=prompt('释放原因（必填）：')||'';if(!reason)return}if(cmd==='complete'){summary=prompt('结果摘要：')||''}
const r=await fetch(`/api/decision/command/${cmd}`,{method:'POST',headers:H,body:JSON.stringify({fingerprint:fp,idempotency_key:`web:${cmd}:${actor}:${fp}:${Date.now()}`,reason_code:reason,outcome_summary:summary})});const d=await r.json();if(!r.ok)return showError(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));load()}
function load(){fetch('/api/decision/engagements',{headers:H}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));render(d)}).catch(showError)}
load();
</script></body></html>
