<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian X · 调权</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}body{max-width:760px;margin:0 auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end}.head h1{font-size:34px;letter-spacing:-.04em}.links a{color:#06c;text-decoration:none;margin-left:12px}.panel{background:#fff;border:1px solid #e5e5ea;border-radius:18px;padding:20px;margin-top:14px}.error,.ok{padding:10px;border-radius:9px;margin:12px 0;display:none}.error{background:#fff1f0;color:#b42318}.ok{background:#e8f7ed;color:#18794e}.state{border-radius:12px;padding:13px 15px;margin:14px 0;font-size:14px}.locked{background:#f7f7f9;color:#424245}.unlocked{background:#fff7df;color:#9a6700}.manual{background:#e7f0ff;color:#0958d9}.row{display:grid;grid-template-columns:150px 1fr 80px;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #f1f1f3}.row small{display:block;color:#86868b;margin-top:3px}.row input{width:100%}.save,.rollback{border:0;background:#0a84ff;color:#fff;padding:11px 15px;border-radius:10px;margin-top:18px;cursor:pointer}.rollback{background:#f2f2f7;color:#1d1d1f;margin-left:8px}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:560px){.row{grid-template-columns:1fr 1fr 65px}}
</style></head><body><div class="head"><div><div style="color:#86868b">BRIAN X / SETTINGS · <span id="actor"></span></div><h1>调权面板</h1></div><nav class="links"><a href="/static/apps/brianx/index.html">今日推荐</a></nav></div><div id="version" style="color:#86868b;margin-top:4px">加载中…</div><div id="error" class="error"></div><div id="ok" class="ok"></div><div id="state" class="state locked">读取解锁状态中…</div><section class="panel"><div id="weights"></div><button id="save" class="save" disabled>保存手工版本</button><button id="rollback" class="rollback" style="display:none">回滚 baseline</button></section><script>
const errorEl=document.getElementById('error'),okEl=document.getElementById('ok'),host=document.getElementById('weights'),save=document.getElementById('save'),stateEl=document.getElementById('state'),rollbackBtn=document.getElementById('rollback');
const show=(el,msg)=>{el.textContent=msg;el.style.display='block'};
let actor=localStorage.getItem('brianx_actor')||'';if(!actor){actor=prompt('输入你的顾问 ID（X-Actor）：')||'';if(actor)localStorage.setItem('brianx_actor',actor)}
document.getElementById('actor').textContent=actor||'未登录';
const H=()=>({'Content-Type':'application/json',...(actor?{'X-Actor':actor}:{})});
let registry={},values={},baseline={},manualActive=false;
const normalized=()=>{const sum=Object.values(values).reduce((a,b)=>a+b,0);return sum?Object.fromEntries(Object.entries(values).map(([k,v])=>[k,v/sum])):values};
function render(editable){const n=normalized();host.innerHTML=Object.entries(registry).map(([key,meta])=>`<label class="row"><span>${meta.desc}<small>${(n[key]*100).toFixed(1)}%</small></span><input data-key="${key}" type="range" min="0" max="100" step="1" value="${Math.round(values[key]*100)}" ${editable?'':'disabled'}><output>${(values[key]*100).toFixed(0)}%</output></label>`).join('');
if(editable)host.querySelectorAll('input').forEach(input=>input.oninput=()=>{values[input.dataset.key]=Number(input.value)/100;render(true)})}
function load(){fetch('/api/decision/policy',{headers:H()}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));
registry=d.registry||{};values=d.policy.weights;baseline=d.policy.weights;manualActive=d.policy.kind==='manual_override';
document.getElementById('version').textContent=`当前策略 ${d.policy.policy_version}（${d.policy.kind}）`;
const mt=d.manual_tuning||{};
if(manualActive){stateEl.className='state manual';stateEl.textContent='手工调权生效中 · 优先级高于自动策略与 baseline';render(true);save.disabled=false;rollbackBtn.style.display='inline-block'}
else if(mt.unlocked){stateEl.className='state unlocked';stateEl.textContent=`已解锁：${mt.hint||'连续 2 轮反馈不满意，已为你开放手工调权'}`;render(true);save.disabled=false;rollbackBtn.style.display='none'}
else{stateEl.className='state locked';stateEl.textContent=`锁定（只读展示 baseline）· ${mt.hint||'还需 2 轮不满意反馈解锁手工调权'}`;render(false);save.disabled=true;rollbackBtn.style.display='none'}}).catch(e=>{show(errorEl,e.message);stateEl.textContent='状态加载失败';render(false)})}
save.onclick=()=>{save.disabled=true;fetch('/api/decision/weights',{method:'POST',headers:H(),body:JSON.stringify({weights:values,note:'manual_override',changed_by:actor})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));show(okEl,`手工版本 v${d.version} 已生效（优先级最高）`);load()}).catch(e=>show(errorEl,e.message)).finally(()=>save.disabled=false)};
rollbackBtn.onclick=()=>{if(!confirm('确认回滚到 baseline？'))return;fetch('/api/decision/weights',{method:'POST',headers:H(),body:JSON.stringify({weights:baseline,note:'rollback_to_baseline',changed_by:actor})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));show(okEl,'已回滚 baseline');load()}).catch(e=>show(errorEl,e.message))};
load();
</script></body></html>
