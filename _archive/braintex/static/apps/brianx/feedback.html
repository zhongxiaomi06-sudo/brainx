<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian X · 反馈录入</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}body{max-width:680px;margin:0 auto;padding:28px}.eyebrow{color:#86868b;font-size:13px}h1{font-size:34px;letter-spacing:-.04em;margin:6px 0 18px}.links a{color:#06c;text-decoration:none;margin-left:12px}.panel{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:20px}label{display:block;font-size:13px;color:#424245;margin:14px 0 6px}input,select,textarea{width:100%;padding:9px;border:1px solid #d1d1d6;border-radius:9px;font-size:14px}button{border:0;background:#0a84ff;color:#fff;padding:11px 16px;border-radius:10px;margin-top:18px;cursor:pointer;font-size:15px}.error,.ok,.corr{padding:11px;border-radius:9px;margin:12px 0;display:none;font-size:13px}.error{background:#fff1f0;color:#b42318}.ok{background:#e8f7ed;color:#18794e}.corr{background:#fff7df;color:#9a6700}.muted{color:#86868b;font-size:12px;margin-top:6px}
</style></head><body><div class="eyebrow">TTC / BRIAN X · <span id="actor"></span> · <a href="/static/apps/brianx/index.html">今日推荐</a> <a href="/static/apps/brianx/engagements.html">我的承接</a></div><h1>反馈录入</h1><div id="error" class="error"></div><div id="ok" class="ok"></div><div id="corr" class="corr"></div><section class="panel">
<label>机会 fingerprint</label><input id="fp" placeholder="fp-…（今日推荐卡片上可见）">
<label>阶段 stage</label><select id="stage"><option>推荐</option><option>沟通</option><option selected>面试</option><option>Offer</option><option>入职</option><option>关闭</option><option>反馈</option></select>
<label>结果值（JSON）</label><textarea id="value" rows="4" placeholder='{"result":"通过"} 或 {"rating":4}'>{"result":"通过"}</textarea>
<label>范围 scope</label><select id="scope"><option value="consultant_scoped" selected>consultant_scoped（我个人）</option><option value="team_aggregate">team_aggregate（团队汇总）</option></select>
<button id="save">提交结果</button><div class="muted">同一阶段重复提交不同值：历史不改，只追加 CORRECTION 纠错事件。</div></section><script>
const errorEl=document.getElementById('error'),okEl=document.getElementById('ok'),corrEl=document.getElementById('corr');
const show=(el,m)=>{el.textContent=m;el.style.display='block'};
const escReset=()=>{errorEl.style.display=okEl.style.display=corrEl.style.display='none'};
let actor=localStorage.getItem('brianx_actor')||'';if(!actor){actor=prompt('输入你的顾问 ID（X-Actor）：')||'';if(actor)localStorage.setItem('brianx_actor',actor)}
document.getElementById('actor').textContent=actor||'未登录';
document.getElementById('save').onclick=()=>{escReset();let value;try{value=JSON.parse(document.getElementById('value').value)}catch(e){return show(errorEl,'结果值不是合法 JSON')}
const stage=document.getElementById('stage').value,fp=document.getElementById('fp').value.trim();if(!fp)return show(errorEl,'请填写 fingerprint');
fetch('/api/decision/outcome',{method:'POST',headers:{'Content-Type':'application/json',...(actor?{'X-Actor':actor}:{})},body:JSON.stringify({fingerprint:fp,stage,value,scope:document.getElementById('scope').value,idempotency_key:`web:outcome:${actor}:${fp}:${stage}:${Date.now()}`})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));
show(okEl,d.already?'该结果已提交过（幂等去重）':'结果已录入 ✅');if(d.correction)show(corrEl,'检测到同阶段历史值不同：已按规则生成 CORRECTION 事件，历史记录未改动。');}).catch(e=>show(errorEl,e.message))};
</script></body></html>
