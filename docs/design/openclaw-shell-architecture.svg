<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 666" width="680" height="666" role="img" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>BrainX 基于 OpenClaw 壳子的分层架构图</title>
<desc>自上而下五层：飞书群接入、OpenClaw 飞书渠道、OpenClaw Gateway 壳子、并列的 Skill 层与 MCP 层、BrainX 领域权威层。</desc>
