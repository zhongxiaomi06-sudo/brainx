<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian X · 决策回放</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1000px;margin-inline:auto}.eyebrow{color:#86868b;font-size:13px}h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.04em;margin:6px 0 18px}.links a{color:#06c;text-decoration:none;margin-left:12px}.panel{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:17px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 10px}.snapshot{white-space:pre-wrap;background:#f7f7f9;border-radius:10px;padding:12px;font-size:13px;color:#424245;max-height:260px;overflow:auto}.dimension{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f1f1f3;font-size:13px}.dimension small{color:#86868b;display:block}.bar{height:7px;background:#e9e9ed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#0a84ff}.tl{border-left:2px solid #e5e5ea;margin-left:6px;padding-left:16px}.tl div{margin:9px 0;font-size:13px}.tl .t{color:#86868b;font-size:12px}.badge{border-radius:999px;padding:3px 8px;font-size:12px;background:#f2f2f7}.error{display:none;background:#fff1f0;color:#b42318;border-radius:10px;padding:12px;margin:12px 0}.muted{color:#86868b;font-size:13px}
</style></head><body><div class="eyebrow">TTC / BRIAN X · 决策回放 · <a href="/static/apps/brianx/index.html">返回今日推荐</a></div><h1 id="title">加载中…</h1><div id="error" class="error"></div><section class="panel" id="meta"></section><section class="panel"><h2>原始 JD 快照</h2><div class="snapshot" id="snapshot"></div></section><section class="panel"><h2>5 维特征（分 × 权重 = 加权）</h2><div id="dims"></div></section><section class="panel"><h2>事件时间线</h2><div class="tl" id="timeline"></div></section><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const recId=new URLSearchParams(location.search).get('rec_id');
const actor=localStorage.getItem('brianx_actor')||'';
const errorEl=document.getElementById('error');const showError=e=>{errorEl.textContent=e.message||e;errorEl.style.display='block'};
if(!recId)showError('缺少 rec_id 参数');
fetch(`/api/decision/replay/${recId}`,{headers:actor?{'X-Actor':actor}:{}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));
const rec=d.recommendation;document.getElementById('title').textContent=`${rec.job_title||'未命名'} @ ${rec.company||'未知'} · ${Number(rec.total_score||0).toFixed(1)}分`;
document.getElementById('meta').innerHTML=`顾问 <b>${esc(rec.consultant)}</b> · 日期 ${esc(rec.rec_date)} · 策略 <b>${esc(rec.policy_version||'—')}</b>（weight v${rec.weight_version}） · 分档 ${esc(rec.action||'—')} / ${esc(rec.confidence_band||'—')} · 证据覆盖 ${Math.round((rec.evidence_coverage||0)*100)}% · 当日排序 <b>${d.rank.position??'—'}/${d.rank.total}</b>`;
document.getElementById('snapshot').textContent=rec.jd_text_snapshot||'（无快照）';
document.getElementById('dims').innerHTML=(rec.dimensions||[]).map(x=>`<div class="dimension"><span>${esc(x.name)}<small>${esc(x.reason||'')}</small></span><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(x.score)||0))}%"></i></div><span>${Number(x.score||0).toFixed(1)} × ${Number(x.weight||0).toFixed(2)} = ${Number(x.weighted||0).toFixed(1)}</span></div>`).join('')||'<div class="muted">无维度数据</div>';
document.getElementById('timeline').innerHTML=(d.timeline||[]).map(e=>`<div><span class="badge">${esc(e.event_type)}</span> ${esc(e.previous_state)} → <b>${esc(e.next_state)}</b><div class="t">${esc(e.occurred_at)} · ${esc(e.actor)}</div></div>`).join('')||'<div class="muted">暂无事件</div>';}).catch(showError);
</script></body></html>
