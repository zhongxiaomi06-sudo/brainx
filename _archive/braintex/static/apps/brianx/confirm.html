<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian X · 确认</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(620px,100%);background:#fff;border:1px solid #e5e5ea;border-radius:20px;padding:28px;box-shadow:0 14px 40px #1d1d1f12}h1{margin:0 0 8px;font-size:28px}.muted{color:#86868b}.error{display:none;background:#fff1f0;color:#b42318;border-radius:9px;padding:11px;margin:14px 0}.people{padding-left:20px}.reason{width:100%;min-height:88px;padding:10px;border:1px solid #d1d1d6;border-radius:9px;margin:15px 0;display:none}.confirm{border:0;border-radius:11px;background:#0a84ff;color:#fff;padding:12px 18px;font-size:16px;cursor:pointer}.confirm:disabled{opacity:.5}</style></head><body><main class="box"><div id="error" class="error"></div><div class="muted">BRIAN X / 推荐确认</div><h1 id="title">加载中…</h1><div id="summary" class="muted"></div><ul id="people" class="people"></ul><textarea id="reason" class="reason" maxlength="255" placeholder="暂不考虑时请填写原因"></textarea><button id="confirm" class="confirm" disabled>加载中…</button></main><script>
const q=new URLSearchParams(location.search),token=q.get('token')||'',action=q.get('action')||'adopt',errorEl=document.getElementById('error'),button=document.getElementById('confirm'),reason=document.getElementById('reason');const showError=(message)=>{errorEl.textContent=message;errorEl.style.display='block';button.disabled=true};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(action==='ignore')reason.style.display='block';fetch('/api/decision/preview?token='+encodeURIComponent(token)).then(r=>{if(r.status===401)throw Error('链接无效或已过期');if(!r.ok)throw Error('推荐加载失败');return r.json()}).then(data=>{document.getElementById('title').textContent=`${data.job_title||'未命名岗位'} @ ${data.company||'未知公司'} · ${Number(data.total_score||0).toFixed(1)}分`;document.getElementById('summary').textContent=`当前状态：${data.status}`;document.getElementById('people').innerHTML=(data.trial_candidates||[]).map(p=>`<li>${esc(p.name)} · ${Number(p.score||0).toFixed(1)}分</li>`).join('')||'<li>暂无可试单人选</li>';button.textContent=action==='ignore'?'确认暂不考虑':'确认接单';button.disabled=false}).catch(e=>showError(e.message));button.onclick=()=>{button.disabled=true;fetch('/api/decision/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,ignore_reason:reason.value})}).then(async r=>{const data=await r.json();if(r.status===401)throw Error('链接无效或已过期');if(!r.ok)throw Error(data.detail||'记录失败');document.querySelector('.box').innerHTML=`<div class="muted">BRIAN X / 已完成</div><h1>已记录：${data.already?'该推荐已处理过，当前状态：'+data.status:(action==='ignore'?'暂不考虑':'接单')} ✅</h1>`}).catch(e=>{showError(e.message);button.disabled=false})};
</script></body></html>
