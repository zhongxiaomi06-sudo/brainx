name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/btex-frontend/package-lock.json
      - name: 安装后端依赖
        run: npm ci
      - name: 安装前端依赖
        run: npm ci --prefix frontend/btex-frontend
      - name: 执行完整质量门禁
        run: npm run verify:ci
      - name: 保存门禁报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report-${{ github.sha }}
          path: .quality-gate/reports/
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像（不上传）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: brainx:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
