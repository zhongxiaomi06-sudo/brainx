<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TTC Workspace</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:190px 1fr;grid-template-rows:48px 1fr;overflow:hidden}.dock{grid-row:1/3;background:#fff;border-right:1px solid #e5e5ea;padding:18px 12px}.brand{font-weight:700;margin:0 8px 18px}.apps button,.recent button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;border-radius:10px;padding:9px 8px;text-align:left;cursor:pointer}.apps button:hover,.recent button:hover{background:#f2f2f7}.apps img{width:24px;height:24px;border-radius:7px}.section{font-size:12px;color:#86868b;margin:22px 8px 6px}.topbar{display:flex;align-items:center;border-bottom:1px solid #e5e5ea;background:#fff;padding:0 16px;gap:8px}.tabs{display:flex;gap:6px;overflow:auto}.tab{display:flex;align-items:center;gap:8px;background:#f2f2f7;border-radius:8px;padding:7px 10px;font-size:13px}.tab.active{background:#dbeafe;color:#075985}.tab button{border:0;background:transparent;cursor:pointer}.content{position:relative;background:#f5f5f7}.empty{height:100%;display:grid;place-items:center;color:#86868b}.frame-wrap{position:absolute;inset:0;background:#fff}.frame-wrap iframe{border:0;width:100%;height:100%}.external{position:absolute;right:16px;top:12px;border:1px solid #d1d1d6;border-radius:8px;background:#fff;padding:7px 10px;cursor:pointer;z-index:2}@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:auto 48px 1fr}.dock{grid-row:auto;display:flex;align-items:center;gap:12px;overflow-x:auto;padding:10px}.brand{margin:0;white-space:nowrap}.apps,.recent{display:flex;gap:6px}.apps button,.recent button{width:auto;white-space:nowrap}.section{display:none}.topbar{grid-row:2}.content{grid-row:3}}
  </style>
</head>
<body><aside class="dock"><div class="brand">TTC Workspace</div><div id="apps" class="apps"></div><div class="section">最近打开</div><div id="recent" class="recent"></div></aside><header class="topbar"><div id="tabs" class="tabs"></div></header><main id="content" class="content"><div class="empty">选择一个 App 开始工作</div></main><script src="/static/workspace/shell.js"></script></body>
</html>
