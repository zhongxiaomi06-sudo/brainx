<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian X · 客户 360</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1120px;margin-inline:auto}.eyebrow{color:#86868b;font-size:13px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.hero h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;margin:6px 0}.links a{color:#06c;text-decoration:none;margin-left:12px}.card{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:18px;box-shadow:0 8px 24px #1d1d1f0a;margin-bottom:14px}.card h2{margin:0 0 8px;font-size:18px}.muted{color:#86868b;font-size:13px}.row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}.big{border:0;border-radius:12px;padding:10px 18px;background:#0a84ff;color:#fff;font-size:15px;cursor:pointer}.ghost{border:0;border-radius:9px;padding:6px 12px;background:#f2f2f7;color:#1d1d1f;cursor:pointer}.client{display:grid;grid-template-columns:1fr auto;gap:4px;border:1px solid #f1f1f3;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}.client:hover{border-color:#0a84ff}.client b{font-size:15px}.client .sub{color:#86868b;font-size:12px}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;background:#f2f2f7;margin:2px}.heating{background:#ffece8;color:#d4380d}.new{background:#e7f0ff;color:#0958d9}.active{background:#e8f7ed;color:#18794e}.cooling,.closed,.fake_active{background:#f2f2f7;color:#86868b}.pending{background:#fff7e6;color:#ad6800}.confirmed{background:#e8f7ed;color:#18794e}.sig{border-bottom:1px solid #f1f1f3;padding:8px 0;font-size:14px}.sig small{color:#86868b;margin-left:8px}.sig .ex{color:#424245;font-size:12px;margin-top:4px;white-space:pre-wrap}.digest{background:#f0f7ff;border:1px solid #bcd7ff;border-radius:12px;padding:12px 14px;margin:10px 0}.digest p{margin:6px 0;font-size:14px}.err{background:#fff1f0;color:#b42318;border-radius:8px;padding:8px 10px;font-size:13px;margin:4px 0}input[type=text]{border:1px solid #d1d1d6;border-radius:9px;padding:8px 12px;font-size:14px}textarea{border:1px solid #d1d1d6;border-radius:9px;padding:8px 12px;width:100%;min-height:64px;font-size:14px}
</style></head><body>
<section class="hero"><div><div class="eyebrow">TTC / BRIAN X · <span id="actor">未登录</span></div><h1>客户 360</h1></div>
<nav class="links"><a href="/static/apps/brianx/index.html">今日推荐</a><a href="/static/apps/brianx/feishu.html">飞书连接</a><a href="/static/apps/brianx/upload.html">上传简历</a><a href="/static/apps/brianx/weights.html">调权</a></nav></section>

<div id="list-view">
<section class="card"><div class="row"><h2 style="flex:1">客户列表</h2>
<button class="ghost" id="btn-sync">从信号重新归一</button>
<label class="muted"><input type="checkbox" id="hide-pending"> 只看已确认</label></div>
<div class="muted">客户名由 agent 自动归一（<span class="badge pending">待审</span>），点进详情可确认/改名/合并。</div>
<div id="clients"></div></section></div>

<div id="detail-view" style="display:none">
<div class="row"><button class="ghost" id="btn-back">← 返回列表</button></div>
<section class="card" id="client-card"></section>
<section class="card"><h2>今日动态摘要</h2><div id="digest"></div></section>
<section class="card"><h2>信号时间线</h2><div id="signals"></div></section>
<section class="card"><h2>承接与反馈</h2><div id="engage"></div></section>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actor=localStorage.getItem('brianx_actor')||'';
if(!actor){actor=prompt('输入你的顾问 ID（X-Actor）：')||'';if(actor)localStorage.setItem('brianx_actor',actor)}
$('actor').textContent=actor||'未登录';
const H=()=>({'X-Actor':actor,'Content-Type':'application/json'});
let CUR=null;

async function loadList(){
  const r=await fetch('/api/clients');const d=await r.json();
  const hide=$('hide-pending').checked;
  const items=(d.items||[]).filter(c=>!hide||c.review_status==='confirmed');
  $('clients').innerHTML=items.map(c=>`<div class="client" data-id="${c.client_id}">
    <div><b>${esc(c.canonical_name)}</b> <span class="badge ${c.review_status==='confirmed'?'confirmed':'pending'}">${c.review_status==='confirmed'?'已确认':'待审'}</span>
    <div class="sub">别名：${(c.aliases||[]).map(esc).join(' / ')||'—'}${c.cockpit_chat_id?' · 已挂驾驶舱群':''}${c.owner_consultant?' · 负责：'+esc(c.owner_consultant):''}</div></div>
    <div style="text-align:right"><span class="badge heating">升温 ${c.heating||0}</span><span class="badge new">新 ${c.new_cnt||0}</span>
    <div class="sub">信号 ${c.signal_count||0} · 最近 ${esc(String(c.last_seen||'UNKNOWN').slice(0,16))}</div></div></div>`).join('')||'<div class="muted">暂无客户，先点「从信号重新归一」</div>';
  document.querySelectorAll('.client').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
}
async function openDetail(id){
  CUR=id;
  const r=await fetch(`/api/clients/${id}`);const d=await r.json();
  const c=d.client;
  $('client-card').innerHTML=`<h2>${esc(c.canonical_name)} <span class="badge ${c.review_status==='confirmed'?'confirmed':'pending'}">${c.review_status==='confirmed'?'已确认':'待审'}</span></h2>
  <div class="muted">别名：${(c.aliases||[]).map(esc).join(' / ')||'—'}${c.cockpit_chat_id?` · 驾驶舱群 ${esc(c.cockpit_chat_id)}`:''}</div>
  <div class="row">
    <button class="ghost" id="btn-confirm">✅ 确认归一</button>
    <input type="text" id="rename" placeholder="改规范名" style="width:160px"><button class="ghost" id="btn-rename">改名</button>
    <input type="text" id="merge" placeholder="并入目标 client_id" style="width:200px"><button class="ghost" id="btn-merge">合并</button>
  </div>`;
  $('btn-confirm').onclick=()=>review({client_id:id,action:'confirm'});
  $('btn-rename').onclick=()=>review({client_id:id,action:'rename',canonical_name:$('rename').value.trim()});
  $('btn-merge').onclick=()=>review({client_id:id,action:'merge',merge_into:$('merge').value.trim()});
  renderDigest(d);
  $('signals').innerHTML=(d.signals||[]).map(s=>`<div class="sig"><span class="badge ${s.signal_type}">${esc(s.signal_type)}</span> <b>${esc(s.job_title||'(未识别岗位)')}</b><small>${esc(s.company||'')} · ${esc(String(s.last_seen_at||'').slice(0,16))}</small><div class="ex">${esc((s.excerpt||'').slice(0,220))}</div></div>`).join('')||'<div class="muted">UNKNOWN（无信号）</div>';
  const eng=d.engagements||[],out=d.outcomes||[];
  $('engage').innerHTML=(eng.map(e=>`<div class="sig"><b>${esc(e.consultant_id)}</b> ${esc(e.state)}<small>${esc(String(e.last_action_at||'').slice(0,16))}</small></div>`).join('')
    +out.map(o=>`<div class="sig">反馈 <b>${esc(o.consultant_id)}</b> ${esc(o.stage)}<small>${esc(String(o.observed_at||'').slice(0,16))}</small></div>`).join(''))||'<div class="muted">UNKNOWN（暂无承接/反馈）</div>';
  $('list-view').style.display='none';$('detail-view').style.display='';
}
function renderDigest(d){
  const today=new Date().toISOString().slice(0,10);
  const dg=(d.digests||[]).find(x=>x.digest_date===today);
  if(!dg){$('digest').innerHTML=`<div class="muted">今日摘要未生成</div><button class="big" id="btn-gen">生成今日摘要</button>`;$('btn-gen').onclick=genDigest;return}
  $('digest').innerHTML=`<div class="digest"><p>${esc(dg.summary)}</p>
  <div class="muted">状态：${dg.status==='pending'?'待确认':dg.status==='confirmed'?'已确认':'已纠正'}${dg.reviewed_by?' · '+esc(dg.reviewed_by):''}${dg.corrected_text?'<br>纠正：'+esc(dg.corrected_text):''}</div>
  <div class="row"><button class="ghost" id="btn-dg-ok">✅ 确认</button><button class="ghost" id="btn-dg-fix">✏️ 纠正</button><button class="ghost" id="btn-dg-re">↻ 重新生成</button></div>
  <div id="dg-fix-box" style="display:none"><textarea id="dg-fix-text" placeholder="写下正确的动态……"></textarea><button class="big" id="btn-dg-submit" style="margin-top:6px">提交纠正</button></div></div>`;
  $('btn-dg-ok').onclick=()=>digestReview(today,'confirm','');
  $('btn-dg-re').onclick=genDigest;
  $('btn-dg-fix').onclick=()=>{$('dg-fix-box').style.display=''};
  $('btn-dg-submit').onclick=()=>digestReview(today,'correct',$('dg-fix-text').value.trim());
}
async function review(body){const r=await fetch('/api/clients/review',{method:'POST',headers:H(),body:JSON.stringify(body)});const d=await r.json();if(!r.ok){alert(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return}openDetail(CUR)}
async function genDigest(){await fetch(`/api/clients/${CUR}/digest`,{method:'POST',headers:H()});openDetail(CUR)}
async function digestReview(date,action,text){const r=await fetch('/api/clients/digest/review',{method:'POST',headers:H(),body:JSON.stringify({client_id:CUR,digest_date:date,action,corrected_text:text})});const d=await r.json();if(!r.ok){alert(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return}openDetail(CUR)}
$('btn-back').onclick=()=>{$('detail-view').style.display='none';$('list-view').style.display='';loadList()};
$('btn-sync').onclick=async()=>{const r=await fetch('/api/clients/sync',{method:'POST',headers:H()});const d=await r.json();alert(`归一完成：${d.clusters} 个客户（新增 ${d.inserted}，更新 ${d.updated}，挂驾驶舱群 ${d.cockpit_mapped}）`);loadList()};
$('hide-pending').onchange=loadList;
loadList();
</script></body></html>
